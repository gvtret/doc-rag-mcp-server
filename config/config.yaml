pipeline_version: "1.0.0"

paths:
  sources_incoming: "sources/incoming"
  sources_archived: "sources/archived"
  docs_md_dir: "build/docs_md"
  tables_json_dir: "build/tables_json"
  chunks_dir: "build/chunks_jsonl"
  embeddings_dir: "build/embeddings"
  index_dir: "build/index"
  manifest_path: "build/manifest.json"

parsing:
  # С v2.0 единственный backend для PDF — Docling. Ключ оставлен для
  # совместимости со старыми конфигами; допустимые значения "docling" / "auto".
  pdf_backend: "cascade"
  # Backend для DOCX. python-docx — быстрый (по умолчанию), docling —
  # структурный, дороже по времени и памяти.
  docx_backend: "python-docx"
  normalize_whitespace: true
  # Порог качества для fallback на Unstructured. Если score Docling < порога,
  # автоматически пробует Unstructured и берёт лучший результат. 0 = отключено.
  quality_fallback_threshold: 0.5
  # Порог «почти пустой страницы» для метрик покрытия (извлечённый текст).
  min_chars_per_page: 20
  # Год редакции в manifest: ручные карты и эвристика по имени файла.
  # До v2.0 автоматически читалось из PDF-метадаты (PyMuPDF/PyPDF2);
  # после удаления этих зависимостей нужно либо указать год явно через
  # by_basename / by_source_rel_path / by_sha256, либо настроить
  # filename_regex.
  edition_year:
    filename_regex: null
    by_basename: {}
    by_source_rel_path: {}
    by_sha256: {}

sectioning:
  enable_numbered_headings: true
  enable_allcaps_headings: true
  min_heading_len: 4
  max_heading_len: 120

chunking:
  strategy: "recursive"
  target_tokens: 512
  overlap_tokens: 64
  # Нечёткая дедупликация чанков между документами (word-bigram Jaccard).
  # 0 = отключено; 0.85 = убирать чанки с ≥85% совпадением из разных документов.
  # PDF имеет приоритет над DOCX: при совпадении сохраняется PDF-чанк.
  dedup_similarity_threshold: 0.85

embeddings:
  # Embeddings served by local Ollama (shared with openviking).
  provider: "ollama"
  api_base: "http://127.0.0.1:11434"
  # Model name as known to Ollama (`ollama pull bge-m3`).
  #
  # The comment below describes the DISABLED local sentence-transformers
  # branch (kept for reference in case provider is removed):
  # Multilingual (RU+EN): bge-m3, 1024-dim. On a 4 GB GPU (GTX 1650)
  # batch 32 is ~4x faster than 8 (7.9 vs 1.9 chunks/s) and still fits;
  # 48+ hits VRAM limits and degrades. max_seq_length covers the chunk
  # size (~512 tokens) PLUS the embedding context prefix (up to 40
  # tokens + separator headroom; see raglib/embedding_text.py), so a
  # saturated chunk is not silently tail-truncated by the model. bge-m3
  # supports 8192 natively; 576 keeps the extra encode cost ~12%.
  model_name: "bge-m3"
  # Timeouts and degradation guard for the Ollama provider.
  # request_timeout_seconds guards bulk index builds (a batch can be slow on
  # a cold model); query_timeout_seconds guards interactive query embeddings
  # and MUST stay well below the MCP tool budget (DOC_RAG_TOOL_TIMEOUT_SEC,
  # default 30 s) so a stuck Ollama degrades to lexical results instead of
  # returning 504.
  request_timeout_seconds: 120
  # 25 s measured cold model load on this host is ~23 s; keep the query
  # timeout just above it but below the 30 s MCP budget, so a cold first
  # query still succeeds while a wedged backend degrades to lexical in time.
  query_timeout_seconds: 25
  # After this many consecutive embed timeouts the breaker opens for
  # breaker_cooldown_seconds: searches return lexical results immediately and
  # /health reports embeddings_degraded=true.
  breaker_threshold: 2
  breaker_cooldown_seconds: 60
  # device is ignored by the ollama provider (server-side GPU choice);
  # it only matters for the local sentence-transformers fallback branch.
  device: "cpu"
  batch_size: 32
  max_seq_length: 576
  normalize: true
  # Periodic read-only comparison of local weights against the HF Hub
  # (no download, no swap; result surfaces as model_update_available).
  # 0 disables the check.
  update_check_interval_hours: 72
  # Explicit local model directory. When set, the model is managed
  # manually and the background Hub check is disabled (no Hub repo is
  # implied). Leave commented to keep the watcher enabled.
  # model_path: "/path/to/models/bge-m3"

index:
  backend: "faiss"
  metric: "ip"
  top_k: 6

mcp:
  retrieval_mode: "semantic"

quality:
  fail_on_severity: "warn"

server:
  # Только для `doc-rag serve` (legacy debug-сервер, см. docs/cli.md).
  # На проде через systemd/run_mcp_http.sh биндинг задаётся
  # DOC_RAG_HTTP_HOST (см. /etc/default/doc-rag) — это поле не читается.
  host: "127.0.0.1"
  port: 3333
