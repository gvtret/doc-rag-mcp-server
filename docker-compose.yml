services:
  doc-rag-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Embeddings provider is Ollama (config/config.yaml): weights live on
        # the Ollama *server*, so models/bge-m3 is NOT required. Set "1" only
        # for the legacy local sentence-transformers mode (requires
        # models/bge-m3 fetched via scripts/fetch_model.py before build).
        REQUIRE_MODEL: "0"
    container_name: doc-rag-mcp
    environment:
      - DOC_RAG_HTTP_HOST=0.0.0.0
      - DOC_RAG_HTTP_PORT=3333
      # If your client sends an Origin header, allow-list it:
      - DOC_RAG_ALLOWED_ORIGINS=http://127.0.0.1,http://localhost,http://192.168.1.1
      - DOC_RAG_HTTP_LOG=/app/build/http.log
    ports:
      - "3333:3333"
    volumes:
      # Persist build artifacts / indexes:
      - ./build:/app/build
      - ./config:/app/config:ro
      - ./sources:/app/sources
    # config.yaml points at the host Ollama (api_base
    # http://127.0.0.1:11434). Inside the container 127.0.0.1 is the
    # container itself, so route that loopback to the HOST via
    # host-gateway; requires Ollama listening on 0.0.0.0 (OLLAMA_HOST=0.0.0.0
    # on the host's ollama service). For a remote Ollama server instead edit
    # embeddings.api_base in config/config.yaml to http://<host>:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
