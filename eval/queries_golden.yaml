# Golden queries for retrieval-quality eval (scripts/eval_retrieval.py).
#
# STATUS: smoke set. The full operator-annotated set (~80 queries:
# 30 Russian cross-lingual + 30 English + 20 code/table) is PENDING.
# These 10 queries were invented from build/manifest.json document
# titles and validated against the CURRENT retrieval (semantic mode,
# bge-m3, 2026-11-15): each relevant_doc_ids entry below was observed
# in the top-10 of that run. They therefore measure the current system,
# NOT ground truth -- expect this file to be replaced wholesale once
# the operator annotates the real set.
#
# Schema per entry:
#   query: str
#   relevant_doc_ids: [doc_id, ...]       (required, one or more; an
#                                          entry with only chunk ids
#                                          derives doc ids from the
#                                          chunk_id prefix)
#   relevant_chunk_ids: [chunk_id, ...]   (optional; chunk-level metrics
#                                          are computed only when at
#                                          least one evaluated query
#                                          provides them)
#
# Note: queries 7 and 10 are Russian and retrieve English-language
# documents -- intentional cross-lingual probes.
#
# The three chunk-level annotations observed in the validation run are
# parked under "pending operator annotation" below and are NOT part of
# the evaluated set: single-chunk labels (":0") make chunk-level
# metrics degenerate. The harness computes chunk rows only when the
# queries actually evaluated carry relevant_chunk_ids.

