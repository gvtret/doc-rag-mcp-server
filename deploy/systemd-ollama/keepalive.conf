[Service]
# Keep bge-m3 resident between doc-rag queries. The default 1m caused a
# full model reload (~26 s measured on this host) on the first query after
# idle, which is dangerously close to the 30 s MCP tool budget. bge-m3
# costs ~700 MB VRAM; keeping it loaded is cheaper than cold starts.
Environment="OLLAMA_KEEP_ALIVE=30m"
